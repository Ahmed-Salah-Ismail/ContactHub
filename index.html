    <!-- Modal -->
    <div
      class="modal fade"
      id="contactModal"
      tabindex="-1"
      aria-labelledby="modalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow p-2">
          <!-- Header -->
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold text-dark" id="modalTitle">
              Add New Contact
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <!-- Body -->
          <div class="modal-body">
            <!-- Avatar / Change Photo -->
            <div class="text-center mb-4">
              <div
                class="avatar-placeholder d-flex align-items-center justify-content-center mx-auto mb-2 text-white"
              >
                <i class="fa-solid fa-user fa-2x"></i>
              </div>
                                  
                      <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        style="display: none"
                      />

                     
                      <button
                        type="button"
                        class="btn btn-light btn-sm text-secondary fw-medium rounded-3 border-0 px-3"
                        id="changePhotoBtn"
                        onclick="document.getElementById('imageInput').click()"
                      >
                        <i class="fa-solid fa-camera me-1"></i> Change Photo
                      </button>

            <!-- Form Inputs -->
            <form id="contactForm" class="text-start">
              <!-- Full Name -->
              <div class="mb-3">
                <label
                  for="contactName"
                  class="form-label fw-semibold text-secondary small mb-1"
                  >Full Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control custom-input"
                  id="contactName"
                  placeholder="Enter full name"
                  required
                />
              </div>

              <!-- Phone Number -->
              <div class="mb-3">
                <label
                  for="contactPhone"
                  class="form-label fw-semibold text-secondary small mb-1"
                  >Phone Number <span class="text-danger">*</span></label
                >
                <input
                  type="tel"
                  class="form-control custom-input"
                  id="contactPhone"
                  placeholder="e.g., 01012345678"
                  required
                />
              </div>

              <!-- Email Address -->
              <div class="mb-3">
                <label
                  for="contactEmail"
                  class="form-label fw-semibold text-secondary small mb-1"
                  >Email Address</label
                >
                <input
                  type="email"
                  class="form-control custom-input"
                  id="contactEmail"
                  placeholder="name@example.com"
                />
              </div>

              <!-- Address -->
              <div class="mb-3">
                <label
                  for="contactAddress"
                  class="form-label fw-semibold text-secondary small mb-1"
                  >Address</label
                >
                <input
                  type="text"
                  class="form-control custom-input"
                  id="contactAddress"
                  placeholder="Enter address"
                />
              </div>

              <!-- Group -->
              <div class="mb-3">
                <label
                  for="contactGroup"
                  class="form-label fw-semibold text-secondary small mb-1"
                  >Group</label
                >
                <select class="form-select custom-input" id="contactGroup">
                  <option selected disabled value="">Select a group</option>
                  <option value="School">School</option>
                  <option value="Work">Work</option>
                  <option value="Family">Family</option>
                  <option value="Friends">Friends</option>
                </select>
              </div>

              <!-- Notes -->
              <div class="mb-3">
                <label
                  for="contactNotes"
                  class="form-label fw-semibold text-secondary small mb-1"
                  >Notes</label
                >
                <textarea
                  class="form-control custom-input"
                  id="contactNotes"
                  rows="2"
                  placeholder="Add notes about this contact"
                ></textarea>
              </div>

              <!-- Checkboxes -->
              <div class="d-flex gap-4 mb-4 mt-2">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="contactFav"
                  />
                  <label
                    class="form-check-label small fw-medium"
                    for="contactFav"
                  >
                    <i class="fa-solid fa-star text-warning"></i> Favorite
                  </label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="contactEmg"
                  />
                  <label
                    class="form-check-label small fw-medium"
                    for="contactEmg"
                  >
                    <i class="fa-solid fa-heart-pulse text-danger"></i>
                    Emergency
                  </label>
                </div>
              </div>

              <!-- Footer Buttons -->
              <div class="d-flex gap-2">
                <button
                  type="button"
                  class="btn btn-light w-50 py-2 rounded-3 text-secondary fw-semibold"
                  data-bs-dismiss="modal"
                >
                  Cancel
                </button>
                <button
                  type="button"
                  class="btn btn-primary w-50 py-2 rounded-3 text-white fw-semibold"
                  id="saveContactBtn"
                  onclick="addContact()"
                >
                  <i class="fa-solid fa-check me-1"></i> Save Contact
                </button>
                <button
                  type="button"
                  class="btn btn-primary w-50 py-2 rounded-3 text-white fw-semibold"
                  id="UpdateContactBtn"
                  onclick="realUpdateContact()"
                  style="display: none"
                >
                  <i class="fa-solid fa-check me-1"></i> Update Contact
                </button>
              </div>
            </form>
